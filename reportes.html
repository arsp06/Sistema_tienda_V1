<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportes</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <div class="contenedor">

        <button onclick="volverMenu()">
            ← Volver al menú

        <!-- RESUMEN DE VENTAS -->

        <h2>
            Resumen de ventas
        </h2>

<div class="filtro-fechas">

        Desde:

    </label>

    <label>
        Hasta:
        <input type="date" id="fechaReporteHasta">
    </label>

    <button onclick="filtrarReporte()">
        🔎 Generar reporte
    </button>

    <button onclick="mostrarReportes()">
        🔄 Mostrar hoy
    </button>

</div>


        <div class="cabecera-reportes">

            <div>CONCEPTO</div>

            <div>VALOR</div>

        </div>

        <div id="resumenReportes"></div>
       <!-- PRODUCTOS MÁS VENDIDOS -->

<h2>
     Productos más vendidos
</h2>

<div class="cabecera-reportes">

    <div>PRODUCTO</div>

    <div>CANTIDAD</div>

</div>

<div id="productosMasVendidos"></div>


<!-- PRODUCTOS CON POCO STOCK -->

<h2>
     Productos con poco stock
</h2>

<div class="cabecera-reportes">

    <div>PRODUCTO</div>

</div>

<div id="productosPocoStock"></div>

    </div>
